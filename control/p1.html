<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1 PID playground</title></head>
<body style="font-family:sans-serif;max-width:700px;margin:auto;padding:10px">
<h2>P1: PID playground</h2>

<p>Kp <input id="kp" type="range" min="0" max="20" step="0.1" value="9"> <b id="kpv"></b></p>
<p>Ki <input id="ki" type="range" min="0" max="20" step="0.1" value="0"> <b id="kiv"></b></p>
<p>Kd <input id="kd" type="range" min="0" max="5" step="0.05" value="0"> <b id="kdv"></b></p>
<p>K (plant) <input id="K" type="range" min="0.5" max="5" step="0.1" value="1"> <b id="Kv"></b></p>
<p>tau (plant) <input id="tau" type="range" min="0.1" max="5" step="0.1" value="1"> <b id="tauv"></b></p>

<canvas id="c" width="700" height="300" style="width:100%;border:1px solid #888"></canvas>
<pre id="m"></pre>

<script>
const $ = id => document.getElementById(id);
const ids = ["kp","ki","kd","K","tau"];
ids.forEach(i => $(i).oninput = run);

function run(){
  const Kp=+$("kp").value, Ki=+$("ki").value, Kd=+$("kd").value;
  const K=+$("K").value, tau=+$("tau").value;
  ids.forEach(i => $(i+"v").textContent = $(i).value);

  const dt=0.001, T=10, r=1;
  let y=0, I=0, prevE=r, ys=[];
  for(let t=0;t<T;t+=dt){
    const e=r-y;
    I+=e*dt;
    const u=Kp*e+Ki*I+Kd*(e-prevE)/dt;
    y+=dt*(K*u-y)/tau;          // Euler
    prevE=e;
    ys.push(y);
  }
  draw(ys,dt,r);
  metrics(ys,dt,r);
}

function draw(ys,dt,r){
  const c=$("c"), g=c.getContext("2d");
  g.clearRect(0,0,700,300);
  const ymax=Math.max(1.5,...ys);
  const X=i=>i/ys.length*700, Y=v=>300-v/ymax*280-10;
  g.strokeStyle="red"; g.setLineDash([6,4]);
  g.beginPath(); g.moveTo(0,Y(r)); g.lineTo(700,Y(r)); g.stroke();
  g.setLineDash([]); g.strokeStyle="blue"; g.beginPath();
  ys.forEach((v,i)=>{ i? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)); });
  g.stroke();
}

function metrics(ys,dt,r){
  const yf=ys[ys.length-1];
  const t10=ys.findIndex(v=>v>=0.1*r), t90=ys.findIndex(v=>v>=0.9*r);
  const rise = (t10>=0&&t90>=0) ? ((t90-t10)*dt).toFixed(3)+" s" : "never";
  const os = Math.max(0,(Math.max(...ys)-r)/r*100).toFixed(1)+" %";
  let ts=ys.length-1;
  while(ts>0 && Math.abs(ys[ts]-r)<=0.02*r) ts--;
  const settle = ts>=ys.length-2 ? "not settled" : (ts*dt).toFixed(2)+" s";
  const ess=((r-yf)/r*100).toFixed(1)+" %";
  $("m").textContent=`Rise time: ${rise}\nOvershoot: ${os}\nSettling (2%): ${settle}\nSteady-state error: ${ess}`;
}
run();
</script>
</body></html>
